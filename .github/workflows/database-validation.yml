name: SERPIENTE Database Validation

on:
  push:
    paths:
      - "database/**"
      - ".github/workflows/database-validation.yml"
  pull_request:
    paths:
      - "database/**"
      - ".github/workflows/database-validation.yml"

jobs:
  postgres-clean-install:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ceutia
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ceutia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply ordered migrations to clean database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in database/migrations/*.sql; do
            echo "Applying ${migration}"
            psql --host 127.0.0.1 --port 5432 --username postgres --dbname ceutia \
              --set ON_ERROR_STOP=1 \
              --file "${migration}"
          done

      - name: Apply canonical seed
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname ceutia \
            --set ON_ERROR_STOP=1 \
            --file database/seeds/001_initial_data.sql

      - name: Verify critical relations, extensions and integrity triggers
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname ceutia --set ON_ERROR_STOP=1 --command "SELECT extname FROM pg_extension WHERE extname IN ('uuid-ossp','pg_trgm','vector') ORDER BY extname;"
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname ceutia --set ON_ERROR_STOP=1 --command "SELECT COUNT(*) AS users FROM users; SELECT COUNT(*) AS roles FROM roles; SELECT COUNT(*) AS sources FROM sources; SELECT COUNT(*) AS domains FROM domain_config; SELECT COUNT(*) AS serpiente_runtime_tables FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE 'serpiente_%';"
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname ceutia --set ON_ERROR_STOP=1 --command "SELECT COUNT(*) AS array_integrity_triggers FROM pg_trigger WHERE NOT tgisinternal AND tgname LIKE 'validate_%';"

      - name: Verify invalid array references fail closed
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname ceutia --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE fired BOOLEAN := false;
          BEGIN
              BEGIN
                  INSERT INTO evidences (title, type, observation_ids)
                  VALUES ('__integrity_probe__', 'DOCUMENTARY', ARRAY['ffffffff-ffff-ffff-ffff-ffffffffffff']::uuid[]);
              EXCEPTION WHEN OTHERS THEN
                  fired := position('referential integrity violation' IN SQLERRM) > 0;
              END;
              IF NOT fired THEN
                  RAISE EXCEPTION 'array referential-integrity trigger did not reject an unknown observation UUID';
              END IF;
          END;
          $$;
          SQL

      - name: Verify prospective outcome foreign-key linkage
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname ceutia --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
              BEGIN
                  INSERT INTO serpiente_outcomes (prediction_id, outcome_time, payload)
                  VALUES ('__unknown_prediction__', NOW(), '{}'::jsonb);
                  RAISE EXCEPTION 'prospective outcome accepted without a persisted forecast';
              EXCEPTION WHEN foreign_key_violation THEN
                  NULL;
              END;
          END;
          $$;
          SQL
