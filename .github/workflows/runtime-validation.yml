name: SERPIENTE Runtime Validation

on:
  push:
    paths:
      - "backend/**"
      - "config/**"
      - "database/migrations/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/runtime-validation.yml"
  pull_request:
    paths:
      - "backend/**"
      - "config/**"
      - "database/migrations/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/runtime-validation.yml"

concurrency:
  group: serpiente-runtime-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: serpiente_runtime
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d serpiente_runtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile runtime
        run: python -m compileall -q backend
      - name: Prepare PostgreSQL runtime schema
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for migration in database/migrations/*.sql; do
            psql --host 127.0.0.1 --port 5432 --username postgres --dbname serpiente_runtime --set ON_ERROR_STOP=1 --file "${migration}"
          done
      - name: Run runtime tests
        run: pytest -q backend/tests
      - name: Run PostgreSQL persistence integration test
        env:
          SERPIENTE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/serpiente_runtime
        run: pytest -q backend/tests/test_postgres_storage.py
      - name: Run security checks
        run: bandit -q -r backend/app
      - name: Dependency audit
        run: pip-audit
      - name: Validate Compose configuration
        run: docker compose config
        env:
          SERPIENTE_API_KEYS_JSON: '{"ci-key":"ADMIN"}'
      - name: Build runtime image
        run: docker build --tag serpiente:ci .
