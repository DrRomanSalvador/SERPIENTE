services:
  serpiente:
    build: .
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      SERPIENTE_HOST: "0.0.0.0"
      SERPIENTE_PORT: "8001"
      SERPIENTE_RUNTIME_DB: "/data/serpiente-runtime.sqlite3"
      SERPIENTE_DATABASE_URL: "${SERPIENTE_DATABASE_URL:-}"
      SERPIENTE_API_KEYS_JSON: "${SERPIENTE_API_KEYS_JSON:?set SERPIENTE_API_KEYS_JSON before deployment}"
    volumes:
      - serpiente-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  serpiente-data:
