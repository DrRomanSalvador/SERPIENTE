[build-system]
requires = [
    "setuptools>=75.0,<81.0",
    "wheel>=0.45,<1.0"
]
build-backend = "setuptools.build_meta"


[project]
name = "ceutia"
version = "0.1.0"
description = "Evidence-based intelligence, knowledge and early-warning platform for Ceuta."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"

authors = [
    { name = "CEUTIA Project" }
]

keywords = [
    "intelligence",
    "early-warning",
    "knowledge-graph",
    "epistemology",
    "risk-analysis",
    "complex-systems",
    "data-analysis",
    "Ceuta"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    # API
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",

    # Configuration and validation
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",

    # Database
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",

    # HTTP / ingestion
    "httpx>=0.28,<1.0",
    "tenacity>=9.0,<10.0",

    # Multipart / API input handling
    "python-multipart>=0.0.20,<1.0",

    # Scientific computing
    "numpy>=2.1,<3.0",
    "scipy>=1.14,<2.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.6,<2.0",

    # Graph analysis
    "networkx>=3.4,<4.0",

    # Configuration / ontology files
    "PyYAML>=6.0,<7.0",

    # Structured logging
    "structlog>=25.0,<26.0",

    # Date/time handling
    "python-dateutil>=2.9,<3.0",
]


[project.optional-dependencies]

# Development and testing
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<7.0",

    # Static analysis
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",

    # Security analysis
    "bandit>=1.8,<2.0",
    "pip-audit>=2.7,<3.0",

    # Dependency / package inspection
    "pipdeptree>=2.25,<3.0",

    # Git hooks
    "pre-commit>=4.0,<5.0",
]

# Natural-language processing.
# Installed only when CEUTIA actually requires NLP functionality.
nlp = [
    "transformers>=4.48,<5.0",
    "sentence-transformers>=3.3,<4.0",
]

# Deep-learning models.
# Deliberately separated from the base system because of their
# size, attack surface and hardware requirements.
ml = [
    "torch>=2.5,<3.0",
]

# Observability.
observability = [
    "prometheus-client>=0.21,<1.0",
]


[project.scripts]
ceutia = "app.main:main"


[tool.setuptools]
package-dir = { "" = "backend" }


[tool.setuptools.packages.find]
where = [
    "backend"
]

include = [
    "app",
    "app.*"
]

exclude = [
    "tests",
    "tests.*"
]


# ---------------------------------------------------------------------
# PYTEST
# ---------------------------------------------------------------------

[tool.pytest.ini_options]

pythonpath = [
    "backend"
]

testpaths = [
    "tests"
]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--disable-warnings"
]

asyncio_mode = "auto"


# ---------------------------------------------------------------------
# RUFF
# ---------------------------------------------------------------------

[tool.ruff]

line-length = 100
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
]

[tool.ruff.lint]

select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "N",
    "SIM",
    "S",
    "A",
    "C4",
    "DTZ",
    "ISC",
    "PIE",
    "PT",
    "RET",
    "RSE",
    "SLF",
    "T20",
    "TRY",
    "RUF"
]

ignore = [
    "S101"
]

[tool.ruff.lint.per-file-ignores]

"tests/*" = [
    "S101"
]

[tool.ruff.format]

quote-style = "double"
indent-style = "space"
line-ending = "lf"


# ---------------------------------------------------------------------
# MYPY
# ---------------------------------------------------------------------

[tool.mypy]

python_version = "3.12"

strict = true

warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

disallow_untyped_defs = true
disallow_any_generics = true
disallow_any_unimported = true

check_untyped_defs = true
no_implicit_optional = true

show_error_codes = true
pretty = true


# ---------------------------------------------------------------------
# BANDIT
# ---------------------------------------------------------------------

[tool.bandit]

exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "build",
    "dist"
]

skips = [
    "B101"
]


# ---------------------------------------------------------------------
# COVERAGE
# ---------------------------------------------------------------------

[tool.coverage.run]

branch = true

source = [
    "backend/app"
]

omit = [
    "*/tests/*",
    "*/__init__.py"
]


[tool.coverage.report]

show_missing = true
skip_covered = false

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError"
]


# ---------------------------------------------------------------------
# SETUPTOOLS
# ---------------------------------------------------------------------

[tool.setuptools.dynamic]

# Reserved for future metadata generated from project files.
# No dynamic runtime configuration is used here.