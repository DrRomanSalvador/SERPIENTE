[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ceutia"
version = "0.1.0"
description = "Evidence-based intelligence and early-warning platform for Ceuta."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }

authors = [
    { name = "CEUTIA Project" }
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",

    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",

    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",

    "python-multipart>=0.0.20,<1.0",

    "httpx>=0.27,<1.0",

    "numpy>=2.1,<3.0",
    "scipy>=1.14,<2.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.5,<2.0",

    "networkx>=3.4,<4.0",

    "PyYAML>=6.0,<7.0",

    "structlog>=24.4,<26.0",

    "tenacity>=9.0,<10.0",

    "python-dateutil>=2.9,<3.0",
]

[project.optional-dependencies]

dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<7.0",

    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",

    "pre-commit>=4.0,<5.0",
]

ml = [
    "torch>=2.5,<3.0",
]

nlp = [
    "transformers>=4.46,<5.0",
    "sentence-transformers>=3.3,<4.0",
]

observability = [
    "prometheus-client>=0.21,<1.0",
]

[project.scripts]
ceutia = "app.main:main"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = [
    "backend"
]

testpaths = [
    "tests"
]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "SIM",
    "RUF"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true

[tool.coverage.run]
branch = true
source = [
    "backend/app"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError"
]