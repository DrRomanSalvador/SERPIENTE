[build-system]
requires = [
    "setuptools>=75.0,<81.0",
    "wheel>=0.45,<1.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "serpiente"
version = "0.1.0"
description = "Executable evidence-based intelligence, longitudinal risk and early-warning runtime for Ceuta."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "SERPIENTE Project" }]
keywords = ["intelligence", "early-warning", "epistemology", "risk-analysis", "complex-systems", "data-analysis", "Ceuta"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "httpx>=0.28,<1.0",
    "tenacity>=9.0,<10.0",
    "python-multipart>=0.0.20,<1.0",
    "numpy>=2.1,<3.0",
    "scipy>=1.14,<2.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.6,<2.0",
    "networkx>=3.4,<4.0",
    "PyYAML>=6.0,<7.0",
    "structlog>=25.0,<26.0",
    "python-dateutil>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
    "bandit>=1.8,<2.0",
    "pip-audit>=2.7,<3.0",
    "pipdeptree>=2.25,<3.0",
    "pre-commit>=4.0,<5.0",
]
nlp = ["transformers>=4.48,<5.0", "sentence-transformers>=3.3,<4.0"]
ml = ["torch>=2.5,<3.0"]
observability = ["prometheus-client>=0.21,<1.0"]

[project.scripts]
serpiente = "app.main:main"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app", "app.*"]
exclude = ["tests", "tests.*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--disable-warnings"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", ".venv", "venv", "build", "dist", "__pycache__", ".pytest_cache", ".mypy_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "S", "A", "C4", "DTZ", "ISC", "PIE", "PT", "RET", "RSE", "SLF", "T20", "TRY", "RUF"]
